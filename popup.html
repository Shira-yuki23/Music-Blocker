<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YT Song Blocker</title>
    <link rel="stylesheet" href="style.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <h1>YT Song Blocker</h1>
      <p>Hide music videos and block their playback on YouTube video pages.</p>
      <label class="toggle">
        <span>Block songs</span>
        <input id="enabled" type="checkbox" role="switch" disabled>
      </label>
      <p id="status" role="status" aria-live="polite">Loading your setting…</p>
      <p id="diagnostics" role="status">Checking this tab…</p>
      <button id="check" type="button">Check this tab</button>
      <p class="note">Version 1.0.4</p>
      <p class="note">Filters video titles. Some music may slip through, and unrelated titles may match.</p>
    </main>
  </body>
</html>
